name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile sources
        run: >-
          python -m compileall -q
          orcai_security.py core audit emergency_protocols monitoring tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run health check
        run: python orcai_security.py health

  container:
    name: Container
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag orcai25:ci \
            .

      - name: Run hardened image
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            orcai25:ci

      - name: Verify runtime user
        run: |
          test "$(docker image inspect orcai25:ci --format '{{.Config.User}}')" \
            = "10001:10001"
