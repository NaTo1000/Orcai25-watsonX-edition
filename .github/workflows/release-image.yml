name: Release container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version tag to publish, such as v1.2.3
        required: true
        type: string
      promote_stable:
        description: Promote this version to the stable tag
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: container-production
  cancel-in-progress: false

jobs:
  publish:
    name: Approved publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PROMOTE_STABLE: ${{ inputs.promote_stable }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "release" ]]; then
            release_tag="${RELEASE_TAG}"
          else
            release_tag="${INPUT_RELEASE_TAG}"
          fi
          if [[ ! "${release_tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must contain a semantic version." >&2
            exit 1
          fi
          version="${release_tag#v}"
          commit="$(git rev-parse HEAD)"

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          promote_stable=false
          if [[ "${EVENT_NAME}" == "release" && "${RELEASE_PRERELEASE}" != "true" ]]; then
            promote_stable=true
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PROMOTE_STABLE}" == "true" ]]; then
            promote_stable=true
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "promote_stable=${promote_stable}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=sha-${{ steps.release.outputs.commit }}
            type=raw,value=stable,enable=${{ steps.release.outputs.promote_stable }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}

      - name: Build standalone Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: orcai25-standalone:${{ steps.release.outputs.version }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ steps.release.outputs.commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Export and checksum standalone image
        working-directory: /tmp
        run: |
          docker image save \
            --output "orcai25-${{ steps.release.outputs.version }}-linux-amd64.docker.tar" \
            "orcai25-standalone:${{ steps.release.outputs.version }}"
          sha256sum \
            "orcai25-${{ steps.release.outputs.version }}-linux-amd64.docker.tar" \
            > "orcai25-${{ steps.release.outputs.version }}-linux-amd64.docker.tar.sha256"

      - name: Upload standalone image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orcai25-${{ steps.release.outputs.version }}-linux-amd64-docker
          path: |
            /tmp/orcai25-${{ steps.release.outputs.version }}-linux-amd64.docker.tar
            /tmp/orcai25-${{ steps.release.outputs.version }}-linux-amd64.docker.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach standalone image to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "/tmp/orcai25-${VERSION}-linux-amd64.docker.tar" \
            "/tmp/orcai25-${VERSION}-linux-amd64.docker.tar.sha256" \
            --clobber

      - name: Preserve current stable image
        if: steps.release.outputs.promote_stable == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          previous_digest="$(
            docker buildx imagetools inspect "${IMAGE}:stable" 2>/dev/null \
              | awk '$1 == "Digest:" {print $2; exit}'
          )" || true
          if [[ -n "${previous_digest}" ]]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:rollback-${GITHUB_RUN_ID}" \
              "${IMAGE}@${previous_digest}"
            echo "previous_stable=${previous_digest}" >> "${GITHUB_ENV}"
          else
            echo "previous_stable=none" >> "${GITHUB_ENV}"
          fi

      - name: Publish multi-architecture image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ steps.release.outputs.commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify and summarize publication
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          PROMOTED: ${{ steps.release.outputs.promote_stable }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" >/dev/null
          {
            echo "## Container publication"
            echo
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Stable promoted: \`${PROMOTED}\`"
            echo "- Previous stable: \`${previous_stable:-not applicable}\`"
            echo "- Standalone artifact: \`orcai25-${VERSION}-linux-amd64-docker\`"
          } >> "${GITHUB_STEP_SUMMARY}"
