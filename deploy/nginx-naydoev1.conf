limit_req_zone $binary_remote_addr zone=naydoev1_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name naydoev1.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name naydoev1.example.com;

    ssl_certificate /etc/letsencrypt/live/naydoev1.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naydoev1.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 1m;

    location / {
        limit_req zone=naydoev1_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}
