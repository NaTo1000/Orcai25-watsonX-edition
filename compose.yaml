name: orcai25

services:
  orcai:
    build:
      context: .
      args:
        VERSION: local
        VCS_REF: local
    image: orcai25:local
    command: ["health"]
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
